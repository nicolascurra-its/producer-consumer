spring.application.name=product-client

server.port=8082

# Indirizzo della Producer API (configurabile, non scritto nel codice Java)
api.base-url=http://localhost:8081/api

# Timeout (in secondi) delle chiamate verso la Producer API
api.connect-timeout-seconds=3
api.read-timeout-seconds=5

spring.thymeleaf.cache=false
