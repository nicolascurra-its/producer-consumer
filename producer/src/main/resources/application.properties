spring.application.name=product-api

server.port=8081

# --- Database MySQL ---
# Modificare username/password in base alla configurazione locale di MySQL
# (la password puo' essere passata anche con la variabile d'ambiente DB_PASSWORD)
spring.datasource.url=jdbc:mysql://localhost:3306/esercitazione_api?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:PASSWORD}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
